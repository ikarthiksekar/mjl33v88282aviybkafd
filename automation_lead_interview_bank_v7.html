<p><strong>Positive:</strong> valid payload, valid auth, expected data returned, expected status code, record actually persisted.</p>
<p><strong>Negative — the ones that find bugs:</strong></p>
<ul>
<li><strong>Missing required field</strong> — expect 400, not 500.</li>
<li><strong>Wrong data type</strong> — string where a number is expected.</li>
<li><strong>Malformed JSON</strong> — a trailing comma or unclosed brace.</li>
<li><strong>Boundary values</strong> — empty string, 0, negative numbers, max length + 1, huge payload.</li>
<li><strong>Auth cases</strong> — no token, expired token, malformed token, another user's token (that last one is the real security test).</li>
<li><strong>Non-existent resource ID</strong> — expect 404, and no stack trace.</li>
<li><strong>Wrong HTTP method</strong> on a valid URL — expect 405.</li>
<li><strong>Wrong Content-Type</strong> — expect 415.</li>
<li><strong>Duplicate create</strong> — expect 409, not a second record.</li>
<li><strong>Special characters and injection strings</strong> in text fields.</li>
</ul>
<div class="tip"><b>Lead angle</b>Any 5xx during negative testing is a defect by definition. The API should reject bad input gracefully, and the error message should help the caller without exposing internals.</div>`},

{c:"manual",q:"What authentication methods have you tested, and what do you check for each?",a:`
<table>
<tr><th>Type</th><th>How it's sent</th></tr>
<tr><td>API Key</td><td>Header (<code>x-api-key</code>) or query param — query params leak into logs, worth raising</td></tr>
<tr><td>Basic Auth</td><td><code>Authorization: Basic base64(user:pass)</code> — encoded, not encrypted</td></tr>
<tr><td>Bearer / JWT</td><td><code>Authorization: Bearer eyJhbGci...</code></td></tr>
<tr><td>OAuth 2.0</td><td>Token fetched from an auth server, then sent as Bearer</td></tr>
<tr><td>Session / cookie</td><td>Cookie header — common where an API backs a web UI</td></tr>
</table>
<p><strong>What to test for every one of them:</strong> valid credentials pass; missing, expired, malformed and revoked credentials all return 401; a valid token for a <em>different</em> user cannot read or modify this user's data; a low-privilege token gets 403 on privileged endpoints; and the refresh flow issues a working token.</p>
<pre><code>// A JWT is three base64 segments: header.payload.signature
// The payload is readable by anyone — decode it and check
// exp (expiry), roles and user id are what you expect.
// Never treat "it's a token" as "it's encrypted".</code></pre>`},

{c:"manual",q:"Which request and response headers matter when you're testing?",a:`
<p><strong>Request headers:</strong></p>
<ul>
<li><code>Content-Type</code> — the format you are <em>sending</em> (<code>application/json</code>).</li>
<li><code>Accept</code> — the format you want <em>back</em>. Different header, constantly confused.</li>
<li><code>Authorization</code> — credentials.</li>
<li><code>Correlation-Id</code> / <code>X-Request-Id</code> — trace one call across microservices; invaluable for defect reports.</li>
</ul>
<p><strong>Response headers:</strong></p>
<ul>
<li><code>Content-Type</code> — confirm it matches what the body actually is.</li>
<li><code>Location</code> — the URL of the newly created resource on a 201.</li>
<li><code>ETag</code> / <code>Cache-Control</code> — caching and conditional requests.</li>
<li><code>X-RateLimit-Remaining</code> / <code>Retry-After</code> — throttling.</li>
<li>Security: <code>Strict-Transport-Security</code>, <code>X-Content-Type-Options</code>, and <code>Access-Control-Allow-Origin</code> — a wildcard <code>*</code> on an authenticated API is worth flagging.</li>
</ul>
<div class="tip"><b>Quick win</b>Send a valid JSON body with <code>Content-Type: text/plain</code>. A well-built API returns 415. A surprising number return 500 — that's a bug you found in thirty seconds.</div>`},

{c:"manual",q:"Walk me through how you test an API manually in Postman.",a:`
<ol>
<li><strong>Read the contract first</strong> — Swagger/OpenAPI: endpoints, required fields, types, auth, expected codes. Import it straight into Postman to generate the requests.</li>
<li><strong>Set up an environment</strong> — <code>{{baseUrl}}</code>, <code>{{token}}</code>, <code>{{userId}}</code> as variables so the same collection runs against QA, UAT and prod-like.</li>
<li><strong>Auth once</strong> — a login request with a test script that saves the token into an environment variable, so every later request reuses it.</li>
<li><strong>Build the CRUD chain</strong> — POST creates and saves the ID, GET verifies persistence, PUT/PATCH updates, GET confirms the change, DELETE removes, final GET returns 404.</li>
<li><strong>Add assertions</strong> in the Tests tab — status code, schema, key values, response time.</li>
<li><strong>Run negative cases</strong> — the list from the negative-testing question.</li>
<li><strong>Run the collection</strong> with Collection Runner + a CSV/JSON data file for data-driven checks.</li>
<li><strong>Hand it to CI</strong> — export and run with Newman, or port the coverage into Rest Assured.</li>
</ol>
<pre><code>// Postman test script — save the token for the next request
pm.test("Login succeeds", () =&gt; pm.response.to.have.status(200));
pm.environment.set("token", pm.response.json().token);

// Typical assertions
pm.test("Status 201", () =&gt; pm.response.to.have.status(201));
pm.test("Under 2s",   () =&gt; pm.expect(pm.response.responseTime).to.be.below(2000));
pm.test("Has id",     () =&gt; pm.expect(pm.response.json()).to.have.property('id'));</code></pre>
<div class="tip"><b>Lead angle</b>Manual Postman work isn't throwaway. Structure the collection so it becomes the specification for the automated suite — chained, variable-driven, environment-agnostic.</div>`},

{c:"manual",q:"There's no documentation for the API. How do you test it?",a:`
<p>It happens more often than anyone admits. In order:</p>
<ul>
<li><strong>Watch the UI</strong> — open DevTools Network tab, drive the feature, and copy the real calls (right-click → copy as cURL, import into Postman). That gives you real URLs, headers and payloads immediately.</li>
<li><strong>Probe the endpoint</strong> — <code>OPTIONS</code> tells you which methods are allowed; a deliberately empty POST usually returns a validation error listing the required fields.</li>
<li><strong>Read the code or the contract file</strong> — controllers, route definitions, or an unpublished swagger endpoint (many services expose one at /swagger or /v3/api-docs).</li>
<li><strong>Check logs and the DB schema</strong> — column names and constraints tell you the field types and what's mandatory.</li>
<li><strong>Ask the developer once, precisely</strong> — bring your inferred contract and ask them to correct it rather than asking them to write documentation.</li>
</ul>
<div class="tip"><b>Lead angle</b>Then write the contract down and get it reviewed. Turning an undocumented API into a documented one is the real deliverable — the tests are a by-product.</div>`},

{c:"manual",q:"How do you test asynchronous APIs, callbacks and webhooks?",a:`
<p>Async endpoints return <strong>202 Accepted</strong> with a job or correlation id — the work isn't done yet, so asserting the final outcome on that response is the classic mistake.</p>
<pre><code>POST /reports          -&gt; 202 Accepted  { "jobId": "abc123", "status": "PENDING" }
GET  /reports/abc123   -&gt; 200 { "status": "PROCESSING" }
GET  /reports/abc123   -&gt; 200 { "status": "COMPLETE", "url": "..." }</code></pre>
<ul>
<li><strong>Poll with a timeout</strong> — repeat the status GET at an interval until it's terminal or the deadline passes. Never a fixed sleep.</li>
<li><strong>Test the failure path</strong> — a job that fails should end in a FAILED status with a reason, not hang in PENDING forever.</li>
<li><strong>Webhooks</strong> — stand up a receiver (a test endpoint, or a service like webhook.site during manual testing), trigger the event, and assert the payload, signature header and delivery timing.</li>
<li><strong>Retries and duplicates</strong> — most webhook providers deliver at-least-once, so verify the consumer is idempotent and handles the same event twice.</li>
<li><strong>Queue-backed flows</strong> — verify the message actually landed on the queue or topic, not just that the API returned 202.</li>
</ul>`},

{c:"manual",q:"How would you test rate limiting, pagination and timeouts?",a:`
<p><strong>Rate limiting:</strong> fire requests past the documented threshold and confirm a <code>429</code>, check <code>X-RateLimit-Remaining</code> decrements accurately, confirm <code>Retry-After</code> is present, and verify access is restored after the window resets. Also check the limit is per-user or per-key, not global — a shared limit means one client can starve everyone.</p>
<p><strong>Pagination:</strong></p>
<pre><code>GET /orders?page=1&amp;size=20
GET /orders?offset=0&amp;limit=20</code></pre>
<ul>
<li>Page size honoured; total count and total pages correct.</li>
<li>No duplicate or missing records across page boundaries.</li>
<li>Out-of-range page returns an empty list, not an error or the last page.</li>
<li>Invalid values — <code>size=0</code>, <code>size=-1</code>, <code>size=999999</code> — handled sensibly.</li>
<li>Sort order stable across pages, otherwise records shuffle between requests.</li>
</ul>
<p><strong>Timeouts:</strong> confirm the client timeout is shorter than the gateway timeout, that a slow downstream returns 504 rather than hanging, and that a timed-out create didn't actually create the record server-side — the classic duplicate-order bug.</p>`},

{c:"manual",q:"What security checks do you run as part of normal API testing?",a:`
<p>Not a penetration test — these are the checks a QA lead should own as routine:</p>
<ul>
<li><strong>Broken object-level authorisation</strong> — log in as user A, call a resource belonging to user B by changing the id in the URL. Expect 403 or 404. This is the single most common serious API defect.</li>
<li><strong>Privilege escalation</strong> — a standard user calling admin endpoints, or sending <code>"role": "ADMIN"</code> in a profile update payload and seeing whether the server accepts it.</li>
<li><strong>Token handling</strong> — expired and revoked tokens rejected; logout actually invalidates; token not accepted after a password change.</li>
<li><strong>Data exposure</strong> — no password hashes, internal ids, stack traces or full PII in responses or error messages.</li>
<li><strong>Transport</strong> — HTTPS enforced, HTTP redirected or refused; no credentials in query strings (they end up in logs and browser history).</li>
<li><strong>Injection strings</strong> in text fields — the response should be a clean validation error, never a database error message.</li>
</ul>
<div class="tip"><b>Lead angle</b>Frame these as regression tests, not a security audit. They're cheap, they run every build, and they catch the class of bug the UI can never reveal because the button was simply hidden.</div>`},

{c:"manual",q:"How do you validate that an API call actually persisted the data?",a:`
<p>A 201 means the request was accepted, not that the record is correct or complete. Three levels of confirmation, in increasing strength:</p>
<ul>
<li><strong>Read-back</strong> — GET the resource by the id from the create response and compare every field you sent. This is the default and covers most cases.</li>
<li><strong>Database check</strong> — query the table directly for fields the API doesn't return: audit columns, status flags, foreign keys, soft-delete markers. Essential when the API hides part of the record.</li>
<li><strong>Downstream check</strong> — confirm the event reached the next system (queue, reporting table, partner feed) when the business flow spans services.</li>
</ul>
<pre><code>-- Typical post-create DB assertion
SELECT status, created_by, is_deleted
FROM   bookings
WHERE  booking_id = ?;</code></pre>
<div class="tip"><b>Caution</b>Keep DB assertions to verification only, never setup. Tests that insert rows directly bypass business logic and pass while the real API is broken.</div>`},

{c:"manual",q:"Why test at the API layer at all when there's a UI suite?",a:`
<ul>
<li><strong>Speed</strong> — roughly 10× faster than the equivalent UI test, so regression drops from hours to minutes.</li>
<li><strong>Stability</strong> — no locators, no rendering, no waits. Most flakiness lives in the browser layer.</li>
<li><strong>Earlier feedback</strong> — the API is usually ready weeks before the screens, so testing can start before there's a UI to click.</li>
<li><strong>Better coverage</strong> — you can hit error paths, boundary values and permission combinations the UI physically prevents you from sending.</li>
<li><strong>Security-relevant</strong> — the UI hides a delete button from a read-only user; only an API test proves the server actually refuses the call.</li>
<li><strong>Setup for UI tests</strong> — create the customer, policy or order via API in seconds instead of clicking through six screens.</li>
</ul>
<div class="tip"><b>Lead angle</b>Frame it as the middle of the test pyramid. UI tests should only cover what genuinely needs a browser — rendering, navigation, real user journeys. Everything else belongs one layer down, and moving it there is usually the single biggest regression-time win available.</div>`},

/* ============ RESTASSURED ============ */
{c:"api",q:"How do you validate an API end-to-end with Rest Assured?",a:`
<p>Check status code, headers, body, schema and response time — not just 200 OK:</p>
<pre><code>given()
    .header("Authorization", "Bearer " + token)
    .contentType(ContentType.JSON)
    .body(payload)
.when()
    .post("/users")
.then()
    .statusCode(201)
    .body("name", equalTo("Karthik"))
    .body("id", notNullValue())
    .body(matchesJsonSchemaInClasspath("user-schema.json"))
    .time(lessThan(2000L));</code></pre>
<p>Then chain: create → GET to confirm persistence → PUT → DELETE → GET returns 404. That's the real end-to-end contract.</p>`},

{c:"api",q:"How do you handle authentication (OAuth2, tokens) in Rest Assured?",a:`
<p>Fetch the token once in suite setup, cache it, inject it via a spec:</p>
<pre><code>RequestSpecification authSpec = new RequestSpecBuilder()
        .setBaseUri(config.get("baseUri"))
        .setContentType(ContentType.JSON)
        .addHeader("Authorization", "Bearer " + TokenManager.get())
        .build();

given().spec(authSpec).when().get("/orders").then().statusCode(200);</code></pre>
<p>Rest Assured also has <code>.auth().oauth2(token)</code>, <code>.basic()</code>, <code>.preemptive()</code>. Credentials come from environment variables or a vault — never from the repo. Handle expiry with a refresh check inside TokenManager.</p>`},

{c:"api",q:"RequestSpecification vs ResponseSpecification — why bother?",a:`
<p>They remove duplication and make suites consistent. Request spec centralises base URI, headers, auth, logging filters. Response spec centralises common assertions:</p>
<pre><code>ResponseSpecification okSpec = new ResponseSpecBuilder()
        .expectStatusCode(200)
        .expectContentType(ContentType.JSON)
        .expectResponseTime(lessThan(3000L))
        .build();

given().spec(authSpec).get("/users").then().spec(okSpec);</code></pre>
<p>Change the base URI or add a header in one place instead of 200 tests.</p>`},

{c:"api",q:"How do you serialise and deserialise POJOs, and why prefer it over raw JSON strings?",a:`
<pre><code>// Serialise: POJO -&gt; request body
User user = new User("Karthik", "QA Lead");
given().body(user)...          // Jackson/Gson handles conversion

// Deserialise: response -&gt; POJO
User created = response.as(User.class);
assertEquals(created.getRole(), "QA Lead");</code></pre>
<p>POJOs give compile-time safety, IDE autocomplete, and refactor support — a renamed field breaks the build rather than failing mysteriously at runtime. Raw strings are fine only for quick negative payloads (malformed JSON tests).</p>`},

{c:"api",q:"JsonPath assertions vs JSON schema validation — when do you use each?",a:`
<p><strong>JsonPath</strong> checks values: <code>response.jsonPath().getString("data[0].id")</code>, filters like <code>data.findAll { it.status == 'ACTIVE' }.size()</code>. Use for business assertions.</p>
<p><strong>Schema validation</strong> checks structure and types — field presence, data types, required fields, enum values. Use it as a contract test so a backend change to a field type fails fast, in every test, without writing per-field assertions.</p>
<p>In practice: schema for the contract, JsonPath for the specific business outcome.</p>`},

{c:"api",q:"How do you test file upload/download, and chain dependent requests?",a:`
<pre><code>// Multipart upload
given().multiPart("file", new File("src/test/resources/doc.pdf"))
       .when().post("/documents")
       .then().statusCode(201);

// Chaining: capture then reuse
String orderId = given().spec(authSpec).body(order)
        .post("/orders").jsonPath().getString("id");

given().spec(authSpec).pathParam("id", orderId)
        .get("/orders/{id}").then().statusCode(200);</code></pre>
<p>Download: assert content type and byte length via <code>response.asByteArray()</code>. Keep the chained ID in a thread-safe context object, not a static field.</p>`},

{c:"api",q:"How do you integrate API automation with the rest of the suite?",a:`
<ul>
<li><strong>Setup/teardown for UI tests</strong> — create the user, order or policy via API in seconds instead of clicking.</li>
<li><strong>Cross-layer validation</strong> — do it in the UI, verify it landed correctly via API or DB.</li>
<li><strong>Shift regression down</strong> — anything that doesn't need the browser becomes an API test.</li>
<li><strong>Contract checks in CI</strong> — schema tests run on every backend build, well before UI regression.</li>
</ul>`},

{c:"api",q:"Path parameters vs query parameters?",a:`
<p><strong>Path params</strong> identify a specific resource; <strong>query params</strong> filter, sort or paginate a collection.</p>
<pre><code>// GET /booking/{id}
given().spec(authSpec)
       .pathParam("id", bookingId)
   .when().get("/booking/{id}")
   .then().statusCode(200);

// GET /booking?firstname=Karthik&amp;checkin=2026-08-01
given().spec(authSpec)
       .queryParam("firstname", "Karthik")
       .queryParam("checkin", "2026-08-01")
   .when().get("/booking")
   .then().body("size()", greaterThan(0));</code></pre>
<p>Rule of thumb: if removing it would make the URL point at something else entirely, it's a path param.</p>`},

{c:"api",q:"Basic auth in Rest Assured — preemptive vs challenged?",a:`
<p><strong>Preemptive</strong> sends the Authorization header with the first request. <strong>Challenged</strong> waits for a 401 and then resends with credentials — an extra round trip, and it fails outright against servers that don't issue a challenge.</p>
<pre><code>// Preemptive — what you almost always want
given().auth().preemptive().basic(username, password)
   .when().get("/accounts")
   .then().statusCode(200);

// Challenged
given().auth().basic(username, password) ...

// Others
given().auth().oauth2(token);
given().auth().form(user, pass, new FormAuthConfig("/login", "user", "pass"));</code></pre>`},

{c:"api",q:"How do you build a request payload — String, Map/JSONObject, or POJO?",a:`
<pre><code>// 1. Text block — quick, good for malformed/negative cases
String body = """
    { "firstname": "Karthik", "totalprice": 500 }
    """;

// 2. Map or JSONObject — dynamic fields, no class needed
JSONObject payload = new JSONObject();
payload.put("firstname", "Karthik");
payload.put("totalprice", 500);

// 3. POJO — the default for maintained suites
Booking booking = new Booking("Karthik", 500, true);
given().spec(authSpec).body(booking).post("/booking");</code></pre>
<p>POJOs win for anything long-lived: compile-time safety, IDE support, and a field rename breaks the build instead of failing at runtime. Serialisation (object → JSON) and deserialisation (<code>response.as(Booking.class)</code>) are handled by Jackson/Gson automatically.</p>`},

{c:"api",q:"What can you pull out of the Response object?",a:`
<pre><code>Response response = given().spec(authSpec).when().get("/booking/101");

int status        = response.getStatusCode();
String contentType= response.getContentType();
long timeMs       = response.getTime();
Headers headers   = response.getHeaders();
String server     = response.getHeader("Server");
String sessionId  = response.getCookie("SESSIONID");
String name       = response.jsonPath().getString("firstname");
List&lt;String&gt; ids  = response.jsonPath().getList("bookings.bookingid");
Booking booking   = response.as(Booking.class);

response.prettyPrint();      // debugging only</code></pre>
<p>Capturing the Response first (instead of chaining straight into <code>.then()</code>) is what lets you reuse values across a chained workflow.</p>`},

/* ============ TESTNG ============ */
{c:"testng",q:"What is the TestNG annotation execution order?",a:`
<pre><code>@BeforeSuite → @BeforeTest → @BeforeClass → @BeforeMethod
      → @Test →
@AfterMethod → @AfterClass → @AfterTest → @AfterSuite</code></pre>
<p>Typical mapping: <code>@BeforeSuite</code> start reports/load config · <code>@BeforeClass</code> launch browser · <code>@BeforeMethod</code> navigate/login · <code>@AfterMethod</code> screenshot on failure, reset state · <code>@AfterSuite</code> flush reports.</p>`},

{c:"testng",q:"How does @DataProvider work?",a:`
<pre><code>@DataProvider(name = "loginData", parallel = true)
public Object[][] getData() {
    return new Object[][] {
        {"admin", "admin123"},
        {"user1", "pass123"}
    };
}

@Test(dataProvider = "loginData")
public void loginTest(String user, String pass) {
    loginPage.login(user, pass);
}</code></pre>
<p>The test runs once per data set. Keep providers in a separate class (<code>dataProviderClass = TestData.class</code>) and feed them from JSON/Excel so data lives outside the code.</p>`},

{c:"testng",q:"@Factory vs @DataProvider?",a:`
<p><code>@DataProvider</code> runs the <strong>same method</strong> with different data. <code>@Factory</code> creates <strong>multiple instances of a test class</strong> with different constructor arguments — useful when the entire class should run against different configs (per browser, per product type).</p>
<p>They combine: Factory produces the class instances, DataProvider feeds each method inside them.</p>`},

{c:"testng",q:"How do you configure parallel execution in TestNG?",a:`
<pre><code>&lt;suite name="Regression" parallel="methods" thread-count="4"&gt;</code></pre>
<p>Modes: <code>methods</code>, <code>classes</code>, <code>tests</code> (each <code>&lt;test&gt;</code> tag), <code>instances</code>. Pair with ThreadLocal drivers and independent data.</p>
<p>Also useful: <code>@Test(threadPoolSize = 3, invocationCount = 9)</code> to hammer a single test across threads — handy for concurrency checks.</p>`},

{c:"testng",q:"Explain dependsOnMethods and its risk.",a:`
<pre><code>@Test
public void login() { }

@Test(dependsOnMethods = "login")
public void createOrder() { }</code></pre>
<p>If <code>login</code> fails, <code>createOrder</code> is <strong>skipped</strong>, not failed — which keeps the report honest. <code>dependsOnGroups</code> works at group level; <code>alwaysRun = true</code> forces execution regardless.</p>
<p><strong>Risk:</strong> coupling. Dependent tests can't run in isolation or in parallel freely, and one failure cascades. Use only for genuine workflow chains; otherwise make each test set up its own state.</p>`},

{c:"testng",q:"How do you implement retry for flaky tests?",a:`
<pre><code>public class RetryAnalyzer implements IRetryAnalyzer {
    private int count = 0;
    private static final int MAX = 2;

    @Override
    public boolean retry(ITestResult result) {
        return count++ &lt; MAX;
    }
}

@Test(retryAnalyzer = RetryAnalyzer.class)
public void flakyTest() { }</code></pre>
<p>Apply globally with <code>IAnnotationTransformer</code> so you don't annotate every test.</p>
<div class="tip"><b>Lead angle</b>Retry is a band-aid. Log every retried test and review the list weekly — otherwise you're hiding real product race conditions.</div>`},

{c:"testng",q:"What are TestNG listeners and which have you used?",a:`
<ul>
<li><code>ITestListener</code> — onTestFailure/Success/Skipped: screenshots, report logging.</li>
<li><code>IRetryAnalyzer</code> — retries.</li>
<li><code>IAnnotationTransformer</code> — modify annotations at runtime (global retry, dynamic timeouts).</li>
<li><code>ISuiteListener</code> — suite-level setup/teardown.</li>
<li><code>IReporter</code> — custom report generation.</li>
</ul>
<pre><code>public class TestListener implements ITestListener {
    @Override public void onTestFailure(ITestResult result) {
        ScreenshotUtil.capture(result.getName());
        ExtentManager.get().fail(result.getThrowable());
    }
}</code></pre>
<p>Register via <code>@Listeners</code> or the <code>&lt;listeners&gt;</code> block in testng.xml.</p>`},

{c:"testng",q:"How do groups work, and how do you build tiered suites?",a:`
<pre><code>@Test(groups = {"smoke", "regression"})
public void loginTest() { }</code></pre>
<pre><code>&lt;groups&gt;
  &lt;run&gt;
    &lt;include name="smoke"/&gt;
    &lt;exclude name="wip"/&gt;
  &lt;/run&gt;
&lt;/groups&gt;</code></pre>
<p>One codebase serves smoke (per commit), sanity (per deploy) and regression (nightly). <code>@BeforeGroups</code>/<code>@AfterGroups</code> handle group-specific setup.</p>`},

{c:"testng",q:"Soft assert vs hard assert?",a:`
<p><strong>Hard</strong> (<code>Assert.assertEquals</code>) stops the test at the first failure. <strong>Soft</strong> collects failures and reports them together at <code>assertAll()</code>:</p>
<pre><code>SoftAssert soft = new SoftAssert();
soft.assertEquals(page.getTitle(), "Dashboard");
soft.assertTrue(page.isLogoDisplayed());
soft.assertAll();   // omit this and the test passes silently</code></pre>
<p>Soft for validating many fields on one screen; hard for preconditions where continuing is pointless. The forgotten <code>assertAll()</code> is a classic interview trap.</p>`},

{c:"testng",q:"How do you pass parameters from testng.xml?",a:`
<pre><code>&lt;parameter name="browser" value="chrome"/&gt;</code></pre>
<pre><code>@BeforeMethod
@Parameters("browser")
public void setup(@Optional("chrome") String browser) { }</code></pre>
<p><code>@Optional</code> supplies a default when the parameter is absent. Rule of thumb: xml parameters for environment/browser config, DataProvider for test data sets.</p>`},

{c:"testng",q:"priority vs dependsOnMethods vs invocationCount — clear them up.",a:`
<ul>
<li><code>priority</code> — ordering hint only (lower runs first). No failure relationship. Default is 0, so unprioritised tests run before priority 1.</li>
<li><code>dependsOnMethods</code> — real dependency: failure upstream skips downstream.</li>
<li><code>invocationCount</code> — runs the same test N times; combine with <code>threadPoolSize</code> for concurrency, or <code>successPercentage</code> to tolerate partial failures.</li>
</ul>
<p>Common gotcha: priority does not guarantee order across parallel threads.</p>`},

{c:"testng",q:"Walk me through your testng.xml.",a:`
<pre><code>&lt;suite name="Regression" parallel="methods" thread-count="4"&gt;

    &lt;parameter name="env" value="staging"/&gt;
    &lt;parameter name="browser" value="chrome"/&gt;

    &lt;listeners&gt;
        &lt;listener class-name="com.qa.listeners.TestListener"/&gt;
        &lt;listener class-name="com.qa.listeners.RetryTransformer"/&gt;
    &lt;/listeners&gt;

    &lt;test name="Smoke"&gt;
        &lt;groups&gt;
            &lt;run&gt;
                &lt;include name="smoke"/&gt;
                &lt;exclude name="wip"/&gt;
            &lt;/run&gt;
        &lt;/groups&gt;
        &lt;classes&gt;
            &lt;class name="com.qa.tests.LoginTest"/&gt;
            &lt;class name="com.qa.tests.PaymentTest"&gt;
                &lt;methods&gt;&lt;exclude name="legacyFlow"/&gt;&lt;/methods&gt;
            &lt;/class&gt;
        &lt;/classes&gt;
    &lt;/test&gt;
&lt;/suite&gt;</code></pre>
<p>Keep several suite files — smoke.xml, regression.xml, api.xml — and point Maven at whichever the pipeline needs.</p>`},

{c:"testng",q:"@BeforeSuite vs @BeforeTest vs @BeforeClass — what actually differs?",a:`
<p>They map to the xml structure, not to intuition:</p>
<ul>
<li><strong>@BeforeSuite</strong> — once for the entire <code>&lt;suite&gt;</code>. Load config, start the report, spin up Grid.</li>
<li><strong>@BeforeTest</strong> — once per <code>&lt;test&gt;</code> tag. Useful when each <code>&lt;test&gt;</code> is a browser or an environment.</li>
<li><strong>@BeforeClass</strong> — once per test class. Launch the browser for that class.</li>
<li><strong>@BeforeMethod</strong> — before every <code>@Test</code>. Navigate, log in, reset state.</li>
</ul>
<p>Interviewers ask this because most people assume "@BeforeTest runs before each test" — it doesn't; that's @BeforeMethod.</p>`},

/* ============ MAVEN ============ */
{c:"maven",q:"Explain the Maven build lifecycle phases you care about.",a:`
<pre><code>validate → compile → test → package → verify → install → deploy</code></pre>
<ul>
<li><code>mvn test</code> — runs unit-style tests via <strong>Surefire</strong>.</li>
<li><code>mvn verify</code> — runs integration tests via <strong>Failsafe</strong> (post-package), then checks.</li>
<li><code>mvn clean install</code> — full build into the local repo.</li>
</ul>
<p>Running a later phase runs everything before it — that's why <code>install</code> triggers your tests.</p>`},

{c:"maven",q:"What are the three Maven lifecycles?",a:`
<ul>
<li><strong>clean</strong> — <code>pre-clean, clean, post-clean</code>. Deletes <code>target/</code>.</li>
<li><strong>default (build)</strong> — validate → compile → test → package → verify → install → deploy.</li>
<li><strong>site</strong> — <code>site</code>, <code>site-deploy</code>: generates project documentation and reports.</li>
</ul>
<pre><code>mvn clean                 # wipe target
mvn clean test            # wipe, compile, run tests
mvn clean install         # ... plus package and install to the local .m2 repo
mvn clean verify -Pregression</code></pre>
<p>Running a phase runs every phase before it in that lifecycle — which is why <code>install</code> executes your tests.</p>`},

{c:"maven",q:"Difference between a Maven phase, a goal and a plugin?",a:`
<ul>
<li><strong>Plugin</strong> — the thing that does the work (surefire, compiler, failsafe, dependency).</li>
<li><strong>Goal</strong> — a single task inside a plugin, written <code>plugin:goal</code>.</li>
<li><strong>Phase</strong> — a stage in the lifecycle that goals bind to.</li>
</ul>
<pre><code>mvn test                  # a PHASE — triggers surefire:test, which is bound to it
mvn dependency:tree       # a GOAL — run directly, no lifecycle involved
mvn surefire:test         # the same goal, invoked explicitly
mvn help:effective-pom    # goal — shows the pom after inheritance is applied</code></pre>`},

{c:"maven",q:"Surefire vs Failsafe — which do you use for automation suites?",a:`
<table>
<tr><th>Surefire</th><th>Failsafe</th></tr>
<tr><td>Runs in <code>test</code> phase</td><td>Runs in <code>integration-test</code> / <code>verify</code></td></tr>
<tr><td>Fails the build immediately</td><td>Defers failure to <code>verify</code> so teardown still runs</td></tr>
<tr><td>Default pattern <code>*Test.java</code></td><td>Default pattern <code>*IT.java</code></td></tr>
</table>
<p>UI/API suites belong in Failsafe when they need the app packaged/deployed first; most Selenium+TestNG teams still drive Surefire with a testng.xml pointer:</p>
<pre><code>&lt;plugin&gt;
  &lt;artifactId&gt;maven-surefire-plugin&lt;/artifactId&gt;
  &lt;configuration&gt;
    &lt;suiteXmlFiles&gt;&lt;suiteXmlFile&gt;testng.xml&lt;/suiteXmlFile&gt;&lt;/suiteXmlFiles&gt;
  &lt;/configuration&gt;
&lt;/plugin&gt;</code></pre>`},

{c:"maven",q:"How do you run different suites/environments from the command line?",a:`
<pre><code>mvn clean test -DsuiteXmlFile=smoke.xml -Denv=qa -Dbrowser=chrome</code></pre>
<p>Read them in code with <code>System.getProperty("env", "qa")</code>, falling back to a properties file. Or use <strong>profiles</strong>:</p>
<pre><code>&lt;profiles&gt;
  &lt;profile&gt;
    &lt;id&gt;regression&lt;/id&gt;
    &lt;properties&gt;&lt;suiteXmlFile&gt;regression.xml&lt;/suiteXmlFile&gt;&lt;/properties&gt;
  &lt;/profile&gt;
&lt;/profiles&gt;</code></pre>
<pre><code>mvn clean verify -Pregression</code></pre>
<p>This is what CI jobs call — same command locally and on the agent.</p>`},

{c:"maven",q:"How do you run a specific class, suite or group from the command line?",a:`
<pre><code># whole suite file
mvn clean test -DsuiteXmlFile=testng.xml

# one class, or one method
mvn test -Dtest=LoginTest
mvn test -Dtest=LoginTest#invalidPasswordTest

# TestNG groups
mvn test -Dgroups=smoke

# browser + environment together
mvn clean test -Dbrowser=chrome -Denv=staging -DsuiteXmlFile=regression.xml

# keep going after a module fails, and skip tests on a packaging build
mvn clean install -DskipTests</code></pre>
<p>Whatever the pipeline runs, make sure it's the exact same command a developer can run locally — that's what stops "works on my machine".</p>`},

{c:"maven",q:"How do you read -D parameters inside Java?",a:`
<pre><code>// mvn test -Denv=staging -Dbrowser=chrome
String env     = System.getProperty("env", "qa");         // second arg = default
String browser = System.getProperty("browser", "chrome");</code></pre>
<p>Wrap it so the whole framework reads config the same way, with a sensible precedence chain — command line beats environment variable beats properties file:</p>
<pre><code>public static String get(String key) {
    String value = System.getProperty(key);                 // -D wins
    if (value == null) value = System.getenv(key.toUpperCase());
    if (value == null) value = properties.getProperty(key); // config.properties
    return value;
}</code></pre>
<p>Also available: <code>System.getenv()</code> for CI secrets, and <code>System.setProperty()</code> if you need to set one at runtime.</p>`},

{c:"maven",q:"Explain Maven dependency scopes and how you resolve version conflicts.",a:`
<ul>
<li><code>compile</code> (default) — available everywhere.</li>
<li><code>test</code> — TestNG, Rest Assured, AssertJ; not shipped.</li>
<li><code>provided</code> — supplied at runtime by the container.</li>
<li><code>runtime</code> — needed to run, not to compile (JDBC drivers).</li>
</ul>
<p>For conflicts, Maven uses <strong>nearest-wins</strong>. Diagnose with <code>mvn dependency:tree</code>, then either <code>&lt;exclusions&gt;</code> the transitive offender or pin the version in <code>&lt;dependencyManagement&gt;</code>. Classic case: Rest Assured and Selenium both pulling different Guava/Jackson versions.</p>`},

/* ============ DEVOPS ============ */
{c:"devops",q:"How do you integrate the suite into CI/CD?",a:`
<ul>
<li><strong>Trigger tiers</strong> — smoke on every PR/commit, sanity on deploy to QA, full regression nightly.</li>
<li><strong>Quality gates</strong> — fail the build on smoke failure; regression failures raise a report and notify, not necessarily block.</li>
<li><strong>Containerise</strong> — run tests in Docker with Selenium Grid/Selenoid so agents are identical.</li>
<li><strong>Artifacts</strong> — publish Extent/Allure HTML, screenshots, videos, and JUnit XML for the pipeline's native test view.</li>
<li><strong>Notify</strong> — Teams/Slack summary with pass rate and a link to the report.</li>
<li><strong>Secrets</strong> — credentials from the pipeline's secret store, never in the pom or repo.</li>
</ul>`},

{c:"devops",q:"Git: difference between fetch and pull?",a:`
<p><code>git fetch</code> downloads remote commits into your local tracking branches but <strong>doesn't touch your working directory</strong>. <code>git pull</code> is <code>fetch</code> + <code>merge</code> (or rebase) — it changes your files immediately.</p>
<pre><code>git fetch origin              # see what's new, safely
git diff main origin/main     # review before integrating
git merge origin/main         # now apply it

git pull                      # both steps at once
git pull --rebase             # replay your commits on top — cleaner history</code></pre>
<p>Fetch first is the safer habit when you have uncommitted work in progress.</p>`},

{c:"devops",q:"Git: how do you push a local project to a remote repository?",a:`
<pre><code>git init
git add .
git commit -m "Initial automation framework"
git branch -M main
git remote add origin https://github.com/org/qa-automation.git
git push -u origin main        # -u sets upstream, so later just 'git push'</code></pre>
<p>Everyday flow after that:</p>
<pre><code>git checkout -b feature/payment-tests
git add . && git commit -m "Add payment regression tests"
git push -u origin feature/payment-tests    # then raise a PR</code></pre>`},

{c:"devops",q:"How do you manage branching for an automation repo?",a:`
<ul>
<li><strong>main protected</strong> — no direct pushes; every change goes through a PR with at least one reviewer.</li>
<li><strong>Feature branches</strong> per story or defect, short-lived, named consistently (<code>feature/</code>, <code>fix/</code>).</li>
<li><strong>Smoke suite runs on every PR</strong> as a merge gate — automation code gets the same quality bar as product code.</li>
<li><strong>Tag per release</strong> so you can reproduce exactly what ran against a given build.</li>
<li><strong>.gitignore</strong> for <code>target/</code>, <code>test-output/</code>, reports, screenshots, and anything with credentials.</li>
</ul>
<div class="tip"><b>Lead angle</b>Secrets in the repo history is the failure that costs you the most — enforce a scanner in the PR pipeline.</div>`},

{c:"devops",q:"How do you debug a failing automation test?",a:`
<p>In the IDE:</p>
<ul>
<li><strong>Breakpoints</strong> — including conditional ones (<code>i == 47</code>) and exception breakpoints that trigger the moment NoSuchElementException is thrown.</li>
<li><strong>Step over / into / out</strong> to follow the call into page objects.</li>
<li><strong>Variable watches and Evaluate Expression</strong> — run <code>driver.findElements(locator).size()</code> live while paused on the failure.</li>
<li><strong>Call stack</strong> to find which layer actually threw.</li>
</ul>
<p>In CI, where you can't attach a debugger, the evidence has to be captured up front: screenshot and page source on failure, video/trace, request/response logs for API calls, and structured logging.</p>
<pre><code>// Log4j2 / SLF4J levels, coarsest to finest
ERROR  → test or framework failure
WARN   → retry happened, fallback used
INFO   → test started, navigated, key business step
DEBUG  → locator resolved, wait satisfied
TRACE  → raw request/response payloads</code></pre>
<p>Run INFO in CI, DEBUG locally. If a CI-only failure can't be diagnosed from the artifacts, that's a gap in the framework, not bad luck.</p>`}

/* Code Decorator & Copy */
function formatAnswers() {
  // Process code blocks for headers, language tags, syntax highlighting, copy buttons
  document.querySelectorAll('.a pre code').forEach(codeEl => {
    if (codeEl.dataset.processed) return;
    codeEl.dataset.processed = "true";
    
    let raw = codeEl.innerText;
    let lang = "CODE";
    if (raw.includes("public class") || raw.includes("WebDriver") || raw.includes("ThreadLocal")) lang = "JAVA";
    else if (raw.startsWith("{") || raw.startsWith("[") || raw.includes('"name":')) lang = "JSON";
    else if (raw.includes("Scenario:") || raw.includes("Given ")) lang = "GHERKIN";
    else if (raw.includes("SELECT ") || raw.includes("WHERE ")) lang = "SQL";
    
    const container = document.createElement('div');
    container.className = 'code-container';
    
    const header = document.createElement('div');
    header.className = 'code-header';
    header.innerHTML = `<span class="code-lang">${lang}</span><button class="btn-copy">Copy</button>`;
    
    const pre = codeEl.parentElement;
    pre.parentNode.insertBefore(container, pre);
    container.appendChild(header);
    container.appendChild(pre);
    
    // Copy Event
    header.querySelector('.btn-copy').addEventListener('click', e => {
      navigator.clipboard.writeText(raw);
      e.target.innerText = 'Copied!';
      setTimeout(() => e.target.innerText = 'Copy', 1800);
    });
  });
}

    <i></i><span>All Tracks</span><b>${Q.length}</b></button>`;
  for (const key in CATS){
    html += `<button class="chip" data-cat="${key}" aria-pressed="${activeCategory===key}" style="--dot:${CATS[key].color}">
      <i></i><span>${CATS[key].label}</span><b>${counts[key]||0}</b></button>`;
  }
  document.getElementById('chips').innerHTML = html;
}

/* Visible Items */
function visible() {
  const q = query.trim().toLowerCase();
  return Q.filter(x => {
    const matchCat = activeCategory === 'all' || x.c === activeCategory;
    const matchSearch = !q || (x.q + ' ' + x.a).toLowerCase().includes(q);
    let matchStatus = true;
    if (activeStatus === 'bookmarked') matchStatus = bookmarks.has(x.id);
    else if (activeStatus === 'completed') matchStatus = done.has(x.id);
    else if (activeStatus === 'unanswered') matchStatus = !done.has(x.id);
    return matchCat && matchSearch && matchStatus;
  });
}

/* Highlight Match */
function highlight(text, q) {
  if (!q.trim()) return text;
  const regex = new RegExp(`(${q.trim().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark class="search-hl">$1</mark>');
}

/* Render Question Cards */
function render() {
  const items = visible();
  document.getElementById('count').textContent = `Showing ${items.length} question${items.length === 1 ? '' : 's'}`;

  const listEl = document.getElementById('list');
  if (!items.length){
    listEl.innerHTML = `<div class="empty">No questions match your current filter or search criteria.</div>`;
  } else {
    let html = '', lastCat = null;
    items.forEach((x, idx) => {
      if (x.c !== lastCat){
        html += `<div class="group-head" style="--gc:${CATS[x.c].color}">
          <span>${CATS[x.c].label}</span>
          <span>${items.filter(i=>i.c===x.c).length} items</span>
        </div>`;
        lastCat = x.c;
      }
      const isDone = done.has(x.id);
      const isBookmarked = bookmarks.has(x.id);
      
      html += `
      <article class="card ${isDone ? 'done' : ''}" data-id="${x.id}" style="--cc:${CATS[x.c].color}">
        <div class="q" role="button" tabindex="0">
          <span class="qnum">${String(idx+1).padStart(2,'0')}</span>
          <span class="qtext">${highlight(x.q, query)}</span>
          <div class="card-actions">
            <button class="btn-icon btn-star ${isBookmarked ? 'bookmarked' : ''}" title="Bookmark Question">★</button>
            <button class="tick" title="Mark as Mastered">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
            </button>
            <svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </div>
        <div class="a-wrap">
          <div class="a-inner">
            <div class="a">${x.a}</div>
          </div>
        </div>
      </article>`;
    });
    listEl.innerHTML = html;
  }
  formatAnswers();
  updateProgress();
}

/* Progress Dashboard Update */
function updateProgress() {
  const pct = Math.round((done.size / Q.length) * 100);
  document.getElementById('radial-score').textContent = `${pct}%`;
  document.getElementById('score').textContent = `${done.size} / ${Q.length} mastered`;
  
  // Radial ring animation (dasharray = 138)
  const offset = 138 - (138 * pct / 100);
  document.getElementById('radial-fill').style.strokeDashoffset = offset;
}

/* Event Listeners */
const listEl = document.getElementById('list');

listEl.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = +card.dataset.id;
  
  // Star/Bookmark toggle
  if (e.target.closest('.btn-star')) {
    e.stopPropagation();
    bookmarks.has(id) ? bookmarks.delete(id) : bookmarks.add(id);
    localStorage.setItem('bank_bookmarks', JSON.stringify([...bookmarks]));
    render();
    return;
  }
  
  // Done Tick toggle
  if (e.target.closest('.tick')) {
    e.stopPropagation();
    done.has(id) ? done.delete(id) : done.add(id);
    localStorage.setItem('bank_done', JSON.stringify([...done]));
    render();
    return;
  }
  
  // Accordion toggle
  if (e.target.closest('.q')) {
    card.classList.toggle('open');
  }
});

// Category Chips click
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  activeCategory = chip.dataset.cat;
  localStorage.setItem('bank_cat', activeCategory);
  renderChips(); render();
});

// Status Tabs click
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeStatus = btn.dataset.status;
    localStorage.setItem('bank_status', activeStatus);
    render();
  });
});

// Search & Hotkeys
const searchInput = document.getElementById('search');
const searchClear = document.getElementById('search-clear');

searchInput.addEventListener('input', e => {
  query = e.target.value;
  searchClear.style.display = query ? 'block' : 'none';
  render();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  query = '';
  searchClear.style.display = 'none';
  render();
});

window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.blur();
  }
});

// Bulk controls
document.getElementById('expand').onclick = () => document.querySelectorAll('.card').forEach(c => c.classList.add('open'));
document.getElementById('collapse').onclick = () => document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
document.getElementById('reset').onclick = () => {
  if (confirm("Reset all completion and bookmark progress?")) {
    done.clear(); bookmarks.clear();
    localStorage.removeItem('bank_done');
    localStorage.removeItem('bank_bookmarks');
    render();
  }
};

/* Flashcard Practice Modal Engine */
const fcModal = document.getElementById('flashcard-modal');
const fcQ = document.getElementById('fc-q');
const fcAns = document.getElementById('fc-answer');
const fcReveal = document.getElementById('fc-reveal');

function openFlashcard() {
  const items = visible();
  if (!items.length) return alert("No questions in current view to practice!");
  fcIndex = 0;
  showFlashcard(items);
  fcModal.classList.add('active');
}

function showFlashcard(items) {
  const item = items[fcIndex];
  document.getElementById('fc-track').textContent = CATS[item.c].label;
  document.getElementById('fc-counter').textContent = `Question ${fcIndex + 1} of ${items.length}`;
  fcQ.textContent = item.q;
  fcAns.innerHTML = item.a;
  fcAns.classList.remove('show');
  fcReveal.style.display = 'block';
  document.getElementById('fc-star').textContent = bookmarks.has(item.id) ? '★ Starred' : '☆ Star';
  document.getElementById('fc-mark').textContent = done.has(item.id) ? '✓ Mastered' : 'Mark Mastered';
  formatAnswers();
}

document.getElementById('btn-flashcard').onclick = openFlashcard;
document.getElementById('fc-close').onclick = () => fcModal.classList.remove('active');
fcReveal.onclick = () => {
  fcAns.classList.add('show');
  fcReveal.style.display = 'none';
};

document.getElementById('fc-next').onclick = () => {
  const items = visible();
  fcIndex = (fcIndex + 1) % items.length;
  showFlashcard(items);
};

document.getElementById('fc-prev').onclick = () => {
  const items = visible();
  fcIndex = (fcIndex - 1 + items.length) % items.length;
  showFlashcard(items);
};

document.getElementById('fc-star').onclick = () => {
  const items = visible();
  const item = items[fcIndex];
  bookmarks.has(item.id) ? bookmarks.delete(item.id) : bookmarks.add(item.id);
  localStorage.setItem('bank_bookmarks', JSON.stringify([...bookmarks]));
  showFlashcard(items); render();
};

document.getElementById('fc-mark').onclick = () => {
  const items = visible();
  const item = items[fcIndex];
  done.has(item.id) ? done.delete(item.id) : done.add(item.id);
  localStorage.setItem('bank_done', JSON.stringify([...done]));
  showFlashcard(items); render();
};

// Init
renderChips();
render();
</script>
</body>
</html>
